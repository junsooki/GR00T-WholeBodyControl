# Record the policy's joint trajectory per environment, for offline rendering.
# TrajectoryRecorderTerm writes dof_pos, root_pos_w and root_quat_w (wxyz) per
# frame, which is everything needed to replay the policy in MuJoCo alongside the
# reference — same scene, same camera, same lighting.
_target_: gear_sonic.envs.manager_env.mdp.recorders.RecordersCfg

trajectory:
  _target_: gear_sonic.envs.manager_env.mdp.recorders.TrajectoryRecorderCfg
  save_path: ${manager_env.config.save_rendering_dir}/trajectory
